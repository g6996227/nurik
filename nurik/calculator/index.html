<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой калькулятор</title>
</head>
<body>

    <input class="js-input-a" type="number" placeholder="Первое число">

    <select class="js-select-operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input class="js-input-b" type="number" placeholder="Второе число">

    <button class="js-btn-result">=</button>

    <p>Результат: <span class="js-output"></span></p>

    <script src="math.js"></script>
    <script src="calculator.js"></script>
    <script src="index.js"></script>

</body>
</html>
